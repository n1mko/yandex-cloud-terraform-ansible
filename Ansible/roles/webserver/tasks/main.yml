---
- name: Обновление apt-кэша и установка Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Запуск и включение автозагрузки Nginx
  service:
    name: nginx
    state: started
    enabled: yes

- name: Развертывание главной страницы из шаблона Jinja2
  template:
    src: index.html.j2
    dest: /var/www/html/index.nginx-debian.html
    mode: '0644'
